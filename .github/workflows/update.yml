name: Update Otto Formula

on:
  workflow_dispatch:
  repository_dispatch:
    types: [otto-release]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Download formula from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Triggered by release event - get tag from event
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Triggered by repository_dispatch
            TAG="${{ github.event.client_payload.tag }}"
          else
            echo "Unknown event type: ${{ github.event_name }}"
            exit 1
          fi

          echo "Downloading otto.rb from release $TAG"
          gh release download "$TAG" --repo kusold/otto --pattern "otto.rb" --output otto.rb

      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit and push
        run: |
          if [ -f otto.rb ]; then
            # Copy the downloaded formula
            cp otto.rb otto.rb

            # Set up git
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Add and commit
            git add otto.rb
            TAG="${{ github.event.release.tag_name || github.event.client_payload.tag }}"
            git commit -m "Update otto to ${TAG}"

            # Push
            git push
          else
            echo "Error: otto.rb not found"
            exit 1
          fi
